<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Registration - Barangay Direct</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="registration-page">
    <h1>Resident Registration</h1>
    <p>Submit your resident details and supporting document together. The barangay will review your application before you can log in.</p>
    <p id="verificationStatusMessage" class="registration-message" role="status" hidden></p>

    <form action="/resident-register" method="POST" enctype="multipart/form-data" id="residentRegistrationForm">
        <label>Full Name:</label><br>
        <input type="text" name="full_name" required><br><br>

        <label>Age:</label><br>
        <input type="number" name="age" min="1" required><br><br>

        <label>Gender:</label><br>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select><br><br>

        <label>Address:</label><br>
        <input type="text" name="address" value="Cogon East, Carmen, Cebu" readonly required><br><br>

        <label>Purok:</label><br>
        <input type="text" name="purok" required><br><br>

        <label>Mobile Number:</label><br>
        <input type="tel" name="mobile_number" required><br><br>

        <label>ID or Certificate:</label><br>
        <input type="file" name="verification_document" accept="image/*,.pdf" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" id="residentPassword" minlength="8" required><br><br>

        <label>Confirm Password:</label><br>
        <input type="password" name="confirm_password" id="residentConfirmPassword" minlength="8" required><br><br>

        <label>Security Question:</label><br>
        <select name="security_question" required>
            <option value="">Choose one</option>
            <option value="color">What is your favorite color?</option>
            <option value="number">What is your favorite number?</option>
            <option value="food">What is your favorite food?</option>
        </select><br><br>

        <label>Your Answer:</label><br>
        <input type="text" name="security_answer" autocomplete="off" maxlength="255" required><br><br>

        <button type="submit">Submit Registration</button>
    </form>

    <p><a href="/resident-login.html">Already have an account? Log in</a></p>

    <script>
        const registrationStatus = new URLSearchParams(window.location.search).get("status");
        const statusMessage = document.getElementById("verificationStatusMessage");
        const registrationForm = document.getElementById("residentRegistrationForm");
        const messages = {
            submitted: "Your registration and verification are under processing. Please wait less than 24 hours for the barangay to review your application.",
            pending: "Your verification application is still under processing. Please wait less than 24 hours for the barangay's review.",
            rejected: "Your verification application was rejected. Please contact the barangay for more information.",
            registered: "This verification has already been used to create an account. You can log in instead.",
            "not-found": "We could not match your previous application. Please check your resident details and try again.",
            "email-taken": "That email is already registered. Please log in or use another email address.",
            "password-mismatch": "Passwords do not match. Please confirm your password and submit again."
        };

        if (messages[registrationStatus]) {
            statusMessage.textContent = messages[registrationStatus];
            statusMessage.classList.add(["submitted", "pending"].includes(registrationStatus) ? "is-pending" : "is-error");
            statusMessage.hidden = false;

            if (["submitted", "pending", "rejected", "registered"].includes(registrationStatus)) {
                registrationForm.hidden = true;
            }
        }

        const passwordInput = document.getElementById("residentPassword");
        const confirmPasswordInput = document.getElementById("residentConfirmPassword");
        const validatePasswordMatch = () => {
            confirmPasswordInput.setCustomValidity(
                confirmPasswordInput.value && confirmPasswordInput.value !== passwordInput.value
                    ? "Passwords do not match."
                    : ""
            );
        };

        passwordInput.addEventListener("input", validatePasswordMatch);
        confirmPasswordInput.addEventListener("input", validatePasswordMatch);
    </script>
</body>
</html>
