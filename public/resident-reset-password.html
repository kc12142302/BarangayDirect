<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Barangay Direct</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="reset-page">
    <h1>Reset Password</h1>

    <p id="resetMessage" class="registration-message is-error" role="alert" hidden>
        The email or security answer could not be verified. Please check your details and try again.
    </p>

    <form action="/resident-forgot-password" method="POST" id="recoveryRequestForm">
        <label>Registered Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Security Question:</label><br>
        <select name="security_question" required>
            <option value="">Choose your registered question</option>
            <option value="color">What is your favorite color?</option>
            <option value="number">What is your favorite number?</option>
            <option value="food">What is your favorite food?</option>
        </select><br><br>

        <label>Your Answer:</label><br>
        <input type="text" name="security_answer" autocomplete="off" maxlength="255" required><br><br>
        <button type="submit">Verify and Create Reset Link</button>
    </form>

    <form action="/resident-reset-password" method="POST" id="changePasswordForm" hidden>
        <input type="hidden" name="token" id="resetToken">

        <label>New Password:</label><br>
        <input type="password" name="password" minlength="8" required><br><br>

        <button type="submit">Change Password</button>
    </form>

    <script>
        const token = new URLSearchParams(window.location.search).get("token");
        const resetParams = new URLSearchParams(window.location.search);
        const recoveryRequestForm = document.getElementById("recoveryRequestForm");
        const changePasswordForm = document.getElementById("changePasswordForm");

        if (token) {
            recoveryRequestForm.hidden = true;
            changePasswordForm.hidden = false;
            document.getElementById("resetToken").value = token;
        } else if (resetParams.get("error") === "1") {
            document.getElementById("resetMessage").hidden = false;
        }
    </script>

    <p><a href="/resident-login.html">Back to Resident Login</a></p>
</body>
</html>
